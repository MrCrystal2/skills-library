<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #card {
    background: #fff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
  }
  #qrcode { margin: 0 auto; }
  #label {
    margin-top: 12px;
    font-size: 13px;
    color: #555;
    word-break: break-all;
    max-width: 260px;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="qrcode"></div>
    <div id="label"></div>
  </div>

<script>
  // Sposób przekazania danych (obsługuje oba scenariusze):
  // 1) Środowisko z narzędziem `run_js`: dane wstrzykiwane jako JSON w window.QR_INPUT,
  //    np. run_js wywołuje ten skrypt z danymi {"url": "https://example.com"}.
  // 2) Ten (Claude.ai) artifact: URL wpisany bezpośrednio poniżej jako fallback,
  //    lub przekazany przez parametr ?url= w query stringu.

  function resolveUrl() {
    if (typeof window.QR_INPUT !== "undefined" && window.QR_INPUT && window.QR_INPUT.url) {
      return window.QR_INPUT.url;
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get("url")) return params.get("url");

    // FALLBACK: podmień poniższy adres, jeśli generujesz statyczny plik bez run_js/query param
    return "https://example.com";
  }

  const targetUrl = resolveUrl();

  new QRCode(document.getElementById("qrcode"), {
    text: targetUrl,
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById("label").textContent = targetUrl;
</script>
</body>
</html>
